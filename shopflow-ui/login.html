<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShopFlow – Đăng Nhập</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="css/client/style.css" />
  <link rel="stylesheet" href="css/client/auth.css" />
</head>
<body>

<div class="auth-layout">

  <!-- VISUAL SIDE -->
  <div class="auth-visual">
    <div class="auth-visual-img">
      <img src="https://images.unsplash.com/photo-1491553895911-0055eca6402d?w=900&q=80" alt="" />
      <div class="auth-visual-overlay"></div>
    </div>
    <div class="auth-visual-content">
      <a href="index.html" class="auth-visual-brand">Shop<span>Flow</span></a>
    </div>
    <div class="auth-visual-content">
      <div class="auth-visual-quote">TRẢI NGHIỆM<br>MUA SẮM <em>ĐỈNH CAO</em></div>
      <p class="auth-visual-sub">Hàng ngàn sản phẩm chính hãng, giao hàng nhanh toàn quốc.</p>
      <div class="flex-center" style="gap:2rem; margin-top: 2rem">
        <div>
          <div style="font-family:'Bebas Neue',sans-serif; font-size:1.8rem; color:white;">50K+</div>
          <div class="text-xs" style="color:rgba(255,255,255,0.5);">Khách hàng</div>
        </div>
        <div>
          <div style="font-family:'Bebas Neue',sans-serif; font-size:1.8rem; color:white;">1.2M+</div>
          <div class="text-xs" style="color:rgba(255,255,255,0.5);">Đơn hàng</div>
        </div>
        <div>
          <div style="font-family:'Bebas Neue',sans-serif; font-size:1.8rem; color:white;">99%</div>
          <div class="text-xs" style="color:rgba(255,255,255,0.5);">Hài lòng</div>
        </div>
      </div>
    </div>
  </div>

  <!-- FORM SIDE -->
  <div class="auth-form-side">
    <div class="auth-form-wrap">

      <div style="margin-bottom: 2rem">
        <h1 style="font-family:'Bebas Neue',sans-serif; font-size:2rem; letter-spacing:1px; margin-bottom:0.2rem">Đăng nhập</h1>
        <p class="text-muted text-sm">Chào mừng bạn trở lại! Vui lòng đăng nhập.</p>
      </div>

      <div id="alertBox" style="display:none" class="alert alert-danger">
        <i class="bi bi-exclamation-circle-fill"></i> <span id="alertMsg">Thông tin đăng nhập không chính xác</span>
      </div>

      <div class="form-group">
        <label class="form-label">Email *</label>
        <div class="input-icon-wrap">
          <i class="bi bi-envelope"></i>
          <input type="email" class="form-control" id="loginEmail" placeholder="email@example.com" />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label flex-between">
          Mật khẩu *
          <a href="#" class="form-link text-sm" style="font-weight:500">Quên mật khẩu?</a>
        </label>
        <div class="input-icon-wrap">
          <i class="bi bi-lock"></i>
          <input type="password" class="form-control" id="loginPw" placeholder="Nhập mật khẩu..." />
          <button class="toggle-pw" onclick="togglePw('loginPw', this)"><i class="bi bi-eye"></i></button>
        </div>
      </div>

      <div class="flex-center" style="margin-bottom:1.5rem">
        <input type="checkbox" id="remember" style="accent-color: var(--dark); width:15px; height:15px" />
        <label for="remember" class="text-sm" style="cursor:pointer">Nhớ đăng nhập</label>
      </div>

      <button class="btn btn-primary btn-block btn-lg" onclick="handleLogin()">
        <i class="bi bi-box-arrow-in-right"></i> ĐĂNG NHẬP
      </button>

      <div class="divider">hoặc tiếp tục với</div>

      <button class="social-btn">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Đăng nhập với Google
      </button>
      <button class="social-btn">
        <i class="bi bi-facebook" style="color:#1877F2; font-size:1.1rem"></i>
        Đăng nhập với Facebook
      </button>

      <p class="text-sm text-muted" style="text-align:center; margin-top:1.5rem">
        Chưa có tài khoản? <a href="register.html" class="form-link">Đăng ký ngay</a>
      </p>
    </div>
  </div>
</div>

<script src="js/client/main.js"></script>
<script src="js/client/auth.js"></script>
</body>
</html>
